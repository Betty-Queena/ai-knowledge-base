spring.application.name=ai-knowledge-base
spring.data.redis.host=localhost
spring.data.redis.port=6379
server.port=8081

# ──────────── Ollama ────────────
# 服务地址只配到这里，各接口路径由代码拼接（避免在完整 URL 上做字符串替换来派生其他接口）
ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:1.5b
ollama.embedding-model=nomic-embed-text:latest

# ──────────── RAG 检索参数 ────────────
rag.chunk-size=500
rag.chunk-overlap=100
rag.top-k=3
# 相似度阈值：-1 表示不过滤（默认）。余弦取值范围为 [-1,1]，故 -1 是"关闭"的自然取值。
# 实际取值必须由检索评估集校准后确定，不要凭经验拍一个数。
rag.min-score=-1.0
# RAG 相关 key 的统一前缀。测试会用独立前缀覆盖，避免测试清理动作删掉生产数据。
rag.redis.key-prefix=rag
# 启动时校验 embedding 模型维度与已存索引是否一致（不一致仅告警，不阻断启动）
rag.startup-check-enabled=true
