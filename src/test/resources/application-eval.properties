# ──────────── 检索评测（Stage 2 / P0）专用 profile ────────────
# 用法：评测类使用 @ActiveProfiles("eval")，本文件即"基线口径"的定义。
#
# 隔离（与 Step3VerificationTest 的 test profile 刻意分开）：
#   - 独立 Redis 库：database=15（生产在 DB0）
#   - 独立 key 前缀：rag-eval
# 两者必须与 test profile 的 rag-test 不同：共用前缀会导致两个测试互相 clear，
# 评测刚索引好的语料会被 Step3VerificationTest 的 @BeforeEach 清掉。
#
# 注意：下面每一项都是基线的一部分。改动任意一项都等于定义了"新基线"，
# 必须重跑评测并重新归档报告，旧报告的数字不再可比。

spring.data.redis.database=15
rag.redis.key-prefix=rag-eval

# ──── 基线固定配置（显式写出，不依赖 application.properties 的继承）────
# 基线口径：nomic-embed-text:latest / 768 维 / chunkSize=500 / overlap=100 / topK=3 / minScore=-1
# 换 embedding 模型会改变整个向量空间，历史指标一律作废。
ollama.embedding-model=nomic-embed-text:latest
rag.chunk-size=500
rag.chunk-overlap=100
# 生产取上下文用的条数，评测检索深度由 RetrievalEvalTest.EVAL_DEPTH 控制（取 5，一次算出 @1/@3/@5）
rag.top-k=3
# P0 固定为"不启用阈值过滤"，只采集分数分布，不选阈值
rag.min-score=-1.0
# 关闭启动自检：避免探针调用干扰延迟测量
rag.startup-check-enabled=false
